[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "https://tennisstringlab.com/*"
  to = "https://tennissetup.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://tennisstringlab.com/*"
  to = "https://tennissetup.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tennisstringlab.com/*"
  to = "https://tennissetup.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.tennisstringlab.com/*"
  to = "https://tennissetup.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tennissetup.com/*"
  to = "https://tennissetup.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.tennissetup.com/*"
  to = "https://tennissetup.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/proplayers.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/visit-stats.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/images.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/favicon-preview.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/mobile-app-mockup*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
